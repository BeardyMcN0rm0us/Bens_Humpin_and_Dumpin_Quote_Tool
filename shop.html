<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Humpin' & Dumpin' Shop</title>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css?v=r427">
<style>
/* Shop-specific styles, layered on top of style.css */
.header-link {
  font-size: 0.72rem;
  font-weight: 900;
  color: var(--ink2);
  text-decoration: none;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 999px;
  flex-shrink: 0;
  transition: all var(--dur);
}
.header-link:hover { color: var(--brand); border-color: var(--brand); }

.page-head { padding: 22px 16px 6px; }
.page-head h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.4rem;
  letter-spacing: 0.04em;
  line-height: 1;
  background: var(--brand-grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.page-head p {
  font-size: 0.88rem;
  color: var(--ink2);
  font-weight: 600;
  margin-top: 6px;
  line-height: 1.55;
}

.filter-bar {
  display: flex;
  gap: 8px;
  padding: 14px 16px 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn {
  flex-shrink: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 9px 18px;
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.78rem;
  color: var(--ink2);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  transition: color var(--dur), background var(--dur), border-color var(--dur), box-shadow var(--dur), transform var(--dur-fast) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.filter-btn:hover { color: var(--ink); border-color: var(--border-2); transform: translateY(-1px); }
.filter-btn.is-active {
  background: var(--brand-grad);
  border-color: transparent;
  color: var(--on-brand);
  box-shadow: 0 8px 20px rgba(255,122,89,0.35);
}

.item-count {
  padding: 10px 16px 0;
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--ink3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  min-height: 24px;
}

.shop-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  padding: 14px 16px 0;
}
@media (min-width: 560px) {
  .shop-list { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
}

.item-card {
  background: linear-gradient(180deg, var(--surface2), var(--surface));
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow-1);
  transition: transform var(--dur) var(--ease), border-color var(--dur), box-shadow var(--dur);
}
.item-card:hover {
  transform: translateY(-3px);
  border-color: var(--border-2);
  box-shadow: var(--shadow-2);
}
.item-main {
  display: flex;
  gap: 14px;
  padding: 14px;
}
.item-img-wrap {
  position: relative;
  width: 110px;
  height: 110px;
  flex-shrink: 0;
  background: #1a1a1a;
  border-radius: var(--r-sm);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.item-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 6px;
  transition: transform 600ms var(--ease);
}
.item-card:hover .item-img-wrap img { transform: scale(1.06); }

.shimmer {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: sh 1.4s infinite;
}
@keyframes sh {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.img-shimmer { width: 100%; height: 100%; }

.sold-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.sold-overlay span {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.7rem;
  color: var(--brand2);
  letter-spacing: 0.12em;
  border: 2px solid var(--brand2);
  padding: 4px 14px;
  border-radius: 6px;
  transform: rotate(-14deg);
  display: block;
  background: rgba(255,122,89,0.08);
  animation: stampIn 0.6s var(--ease);
}
@keyframes stampIn {
  from { transform: rotate(-30deg) scale(0.5); opacity: 0; }
  to   { transform: rotate(-14deg) scale(1); opacity: 1; }
}
.item-card.is-sold { opacity: 0.6; }
.item-card.is-sold .item-title { color: var(--ink2); }
.item-card.is-sold .item-price { color: var(--ink2); -webkit-text-fill-color: var(--ink2); font-size: 1.1rem; }
.sold-label {
  font-size: 0.72rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--brand2);
  margin-top: 2px;
}

.condition-badge {
  position: absolute;
  bottom: 6px; left: 6px;
  font-size: 0.55rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  padding: 3px 7px;
  border-radius: 999px;
  line-height: 1.4;
}
.condition-badge.new    { background: rgba(61,204,122,0.18); color: #6ee49a; border: 1px solid rgba(61,204,122,0.4); }
.condition-badge.opened { background: rgba(255,178,107,0.18); color: var(--brand); border: 1px solid rgba(255,178,107,0.4); }
.condition-badge.used   { background: rgba(122,179,255,0.18); color: #7ab3ff; border: 1px solid rgba(122,179,255,0.4); }

.item-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.item-title {
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.35;
}
.title-shimmer { height: 42px; border-radius: 4px; width: 90%; }
.item-price-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 2px;
  flex-wrap: wrap;
}
.item-price {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.8rem;
  letter-spacing: 0.03em;
  line-height: 1;
  background: var(--brand-grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
.item-rrp {
  font-size: 0.74rem;
  font-weight: 700;
  color: var(--ink3);
  text-decoration: line-through;
}
.item-saving {
  font-size: 0.7rem;
  font-weight: 900;
  color: #6ee49a;
  background: rgba(61,204,122,0.14);
  padding: 2px 8px;
  border-radius: 999px;
}
.item-amazon {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--ink3);
  text-decoration: none;
  margin-top: 2px;
  transition: color var(--dur);
}
.item-amazon:hover { color: var(--brand); }

.item-delivery {
  border-top: 1px solid var(--border);
  padding: 14px;
  background: rgba(0,0,0,0.18);
}
.delivery-toggle {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px;
}
.dtoggle-btn {
  flex: 1;
  padding: 9px 8px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--ink2);
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  font-size: 0.82rem;
  cursor: pointer;
  text-align: center;
  transition: color var(--dur), background var(--dur);
  -webkit-tap-highlight-color: transparent;
}
.dtoggle-btn:hover { color: var(--ink); }
.dtoggle-btn.is-active {
  background: var(--brand-grad);
  color: var(--on-brand);
  box-shadow: 0 4px 12px rgba(255,122,89,0.3);
}
.delivery-fields {
  display: none;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
}
.delivery-fields.open { display: flex; animation: fadeUp 0.3s var(--ease); }
.delivery-fields input {
  width: 100%;
  padding: 13px 14px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  outline: none;
  -webkit-appearance: none;
  transition: border-color var(--dur), box-shadow var(--dur);
}
.delivery-fields input:focus { border-color: var(--brand); box-shadow: var(--brand-glow); }
.delivery-hint {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--ink2);
  line-height: 1.5;
  min-height: 20px;
}
.delivery-hint.ok  { color: #6ee49a; }
.delivery-hint.err { color: var(--brand2); }
.btn-wa {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 999px;
  background: var(--green-grad);
  color: #062b15;
  font-family: 'Nunito', sans-serif;
  font-weight: 900;
  font-size: 0.92rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  letter-spacing: 0.04em;
  box-shadow: 0 10px 24px rgba(31,184,99,0.32);
  transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur);
  -webkit-tap-highlight-color: transparent;
  position: relative; overflow: hidden;
}
.btn-wa::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.32), transparent);
  transform: translateX(-120%);
  transition: transform 0.7s var(--ease);
}
.btn-wa:hover::before { transform: translateX(120%); }
.btn-wa:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(31,184,99,0.42); }
.btn-wa:active { transform: translateY(0) scale(0.97); }

.empty-state {
  text-align: center;
  padding: 64px 16px;
  grid-column: 1 / -1;
}
.empty-state .emoji { font-size: 3.4rem; margin-bottom: 14px; opacity: 0.6; }
.empty-state h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  color: var(--ink);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.empty-state p {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--ink2);
  line-height: 1.55;
}
</style>

</head>
<body>

<div class="app-header" id="appHeader">
  <div class="header-inner">
    <img src="icon-192.png" alt="logo">
    <div class="header-title">
      <h1>Humpin' &amp; Dumpin'</h1>
      <div class="sub">The Shop</div>
    </div>
    <a class="header-link" href="index.html">&#8592; Quotes</a>
  </div>
</div>

<div class="scroll-body" id="scrollBody">
  <div class="page-head">
    <h2>Amazon Vine Finds</h2>
    <p>Tested by Ben &mdash; sold cheap.<br>
    Collection from Doddington or delivery at &pound;0.50/mile.</p>
  </div>
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn is-active" data-f="all">All</button>
    <button class="filter-btn" data-f="new">New</button>
    <button class="filter-btn" data-f="opened">Opened</button>
    <button class="filter-btn" data-f="used">Used</button>
  </div>
  <div class="item-count" id="itemCount"></div>
  <div class="shop-list"  id="shopList"></div>
</div>

<script src="shop-items.js"></script>

<script>
// Wrapped in try/catch at the top level so any error shows a message
// rather than a blank page
try {

var WHATSAPP = '447717463496';
var HOME_PC  = 'PE150SU';
var RATE     = 0.50;
var activeFilter = 'all';
var metaCache = {};

// ── Offset header ──────────────────────────────────────────────────
function setOffset() {
  try {
    var h = document.getElementById('appHeader');
    var b = document.getElementById('scrollBody');
    if (h && b) b.style.paddingTop = (h.offsetHeight + 4) + 'px';
  } catch(e) {}
}
setOffset();
window.addEventListener('resize', function() { try { setOffset(); } catch(e) {} });

// ── Filter buttons ─────────────────────────────────────────────────
document.getElementById('filterBar').querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    try {
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      activeFilter = btn.getAttribute('data-f');
      render();
    } catch(e) {}
  });
});

// ── Microlink fetch (image + title) ───────────────────────────────
function fetchMeta(url, cb) {
  try {
    if (metaCache[url] !== undefined) { cb(metaCache[url]); return; }
    // Set to null immediately so parallel calls don't double-fetch
    metaCache[url] = null;
    fetch('https://api.microlink.io/?url=' + encodeURIComponent(url) +
          '&palette=false&audio=false&video=false&iframe=false')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        try {
          var result = { title: null, img: null };
          if (d && d.status === 'success' && d.data) {
            result.title = d.data.title || null;
            if (d.data.image && d.data.image.url) result.img = d.data.image.url;
            // Try to get price from microlink
            if (d.data.price) result.price = d.data.price;
            else if (d.data.offers && d.data.offers.price) result.price = d.data.offers.price;
          }
          metaCache[url] = result;
          cb(result);
        } catch(e) { cb({ title: null, img: null }); }
      })
      .catch(function() { metaCache[url] = { title: null, img: null }; cb(metaCache[url]); });
  } catch(e) { cb({ title: null, img: null }); }
}

// ── Delivery cost (postcodes.io) ───────────────────────────────────
function calcDelivery(postcode, hintEl, cb) {
  try {
    hintEl.textContent = 'Calculating...';
    hintEl.className = 'delivery-hint';
    var pc = postcode.replace(/\s/g, '').toUpperCase();
    Promise.all([
      fetch('https://api.postcodes.io/postcodes/' + encodeURIComponent(pc)).then(function(r) { return r.json(); }),
      fetch('https://api.postcodes.io/postcodes/' + HOME_PC).then(function(r) { return r.json(); })
    ]).then(function(res) {
      try {
        if (res[0].status !== 200 || res[1].status !== 200) {
          hintEl.textContent = 'Could not find that postcode \u2014 please check it.';
          hintEl.className = 'delivery-hint err';
          cb(null); return;
        }
        var lat1 = res[1].result.latitude,  lon1 = res[1].result.longitude;
        var lat2 = res[0].result.latitude,  lon2 = res[0].result.longitude;
        var R = 3958.8, p = Math.PI / 180;
        var a = 0.5 - Math.cos((lat2 - lat1) * p) / 2 +
                Math.cos(lat1 * p) * Math.cos(lat2 * p) *
                (1 - Math.cos((lon2 - lon1) * p)) / 2;
        var miles = 2 * R * Math.asin(Math.sqrt(a)) * 1.2;
        var cost  = Math.max(5, Math.round(miles * RATE / 5) * 5);
        hintEl.textContent = 'Delivery: ~' + miles.toFixed(1) + ' miles = \u00a3' + cost + ' (\u00a30.50/mile)';
        hintEl.className = 'delivery-hint ok';
        cb(cost, miles.toFixed(1));
      } catch(e) {
        hintEl.textContent = 'Calculation error \u2014 please try again.';
        hintEl.className = 'delivery-hint err';
        cb(null);
      }
    }).catch(function() {
      hintEl.textContent = 'Could not calculate \u2014 check the postcode.';
      hintEl.className = 'delivery-hint err';
      cb(null);
    });
  } catch(e) {
    hintEl.textContent = 'Calculation error.';
    hintEl.className = 'delivery-hint err';
    cb(null);
  }
}

// ── Helpers ────────────────────────────────────────────────────────
function condLabel(c) {
  return c === 'new' ? 'New' : c === 'opened' ? 'Opened' : 'Used';
}
function savingPct(price, rrp) {
  if (!rrp || rrp <= price) return 0;
  return Math.round((1 - price / rrp) * 100);
}
function el(id) { return document.getElementById(id); }

// ── Render ─────────────────────────────────────────────────────────
function render() {
  try {
    var list    = el('shopList');
    var countEl = el('itemCount');
    var allItems = window.SHOP_ITEMS || [];
    var available = allItems.filter(function(it) {
      if (it.sold) return false;
      if (activeFilter === 'all') return true;
      return it.condition === activeFilter;
    });
    var sold = allItems.filter(function(it) {
      if (!it.sold) return false;
      if (activeFilter === 'all') return true;
      return it.condition === activeFilter;
    });
    var items = available.concat(sold);

    if (!items.length) {
      countEl.textContent = '';
      list.innerHTML =
        '<div class="empty-state">' +
          '<div class="emoji">\ud83d\udce6</div>' +
          '<h3>Nothing here</h3>' +
          '<p>No items available right now.<br>Check back soon!</p>' +
        '</div>';
      return;
    }

    countEl.textContent = available.length + ' item' + (available.length !== 1 ? 's' : '') + ' available' + (sold.length ? ', ' + sold.length + ' sold' : '');

    // Build all card HTML in one go
    list.innerHTML = items.map(function(item, i) {
      try {
        var cond    = item.condition || 'used';
        var isSold  = !!item.sold;
        var cached  = metaCache[item.url];
        var imgSrc  = item.img   || (cached && cached.img)   || null;
        var titleTx = item.title || (cached && cached.title) || null;
        var rrpVal  = (cached && cached.price) ? cached.price : (item.rrp ? item.rrp : null);
        var pct     = savingPct(item.price, rrpVal);

        return '<div class="item-card' + (isSold ? ' is-sold' : '') + '" id="card' + i + '">' +
          '<div class="item-main">' +

          // image
          '<div class="item-img-wrap" id="iw' + i + '">' +
            (imgSrc
              ? '<img src="' + imgSrc + '" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'\'">' +
                '<div class="img-placeholder" style="display:none">\ud83d\udce6</div>'
              : '<div class="shimmer img-shimmer" id="ish' + i + '"></div>' +
                '<div class="img-placeholder" id="iph' + i + '" style="display:none">\ud83d\udce6</div>') +
            '<span class="condition-badge ' + cond + '">' + condLabel(cond) + '</span>' +
            (isSold ? '<div class="sold-overlay"><span>SOLD</span></div>' : '') +
          '</div>' +

          // info
          '<div class="item-info">' +
            (titleTx
              ? '<div class="item-title">' + titleTx + '</div>'
              : '<div class="shimmer title-shimmer" id="tsh' + i + '"></div>' +
                '<div class="item-title" id="ttl' + i + '" style="display:none"></div>') +
            (isSold ? '<div class="sold-label">Sold</div>' : '') +
            '<div class="item-price-row" id="pr' + i + '">' +
              '<span class="item-price">\u00a3' + item.price + '</span>' +
              (rrpVal ? '<span class="item-rrp">\u00a3' + rrpVal + '</span>' : '') +
              (pct > 0  ? '<span class="item-saving">' + pct + '% off</span>' : '') +
            '</div>' +
            '<a class="item-amazon" href="' + item.url + '" target="_blank" rel="noopener">View on Amazon \u2197</a>' +
          '</div></div>' +

          // delivery — hide for sold items
          (isSold ? '' :
            '<div class="item-delivery">' +
              '<div class="delivery-toggle">' +
                '<button class="dtoggle-btn is-active" data-i="' + i + '" data-m="collect">\ud83d\ude97 Collection</button>' +
                '<button class="dtoggle-btn"            data-i="' + i + '" data-m="delivery">\ud83d\ude9a Delivery</button>' +
              '</div>' +
              '<div class="delivery-fields" id="df' + i + '">' +
                '<input type="text" id="dpc' + i + '" placeholder="Your postcode...">' +
                '<div class="delivery-hint" id="dh' + i + '">Enter your postcode to see the delivery cost.</div>' +
              '</div>' +
              '<button class="btn-wa" id="wa' + i + '">\ud83d\udcac WhatsApp Ben</button>' +
            '</div>') +

          '</div>';
      } catch(e) {
        // If one card fails to render, show a placeholder instead of dying
        return '<div class="item-card" style="padding:16px;color:var(--ink2);font-size:0.8rem">Item ' + (i+1) + ' could not be displayed.</div>';
      }
    }).join('');

    // Wire up each card independently — one card failing won't affect others
    items.forEach(function(item, i) {
      try {
        var mode   = 'collect';
        var dcost  = null;
        var dmiles = null;

        // Skip interaction wiring for sold items
        if (item.sold) {
          // Still fetch meta for image/title display
          if (!item.img || !item.title) {
            fetchMeta(item.url, function(meta) {
              try {
                if (!item.img && el('ish' + i)) {
                  el('ish' + i).remove();
                  if (meta && meta.img) {
                    var img = document.createElement('img');
                    img.src = meta.img;
                    img.onerror = function() { img.remove(); var ph = el('iph' + i); if (ph) ph.style.display = ''; };
                    var wrap = el('iw' + i);
                    if (wrap) wrap.insertBefore(img, wrap.firstChild);
                  } else { var ph = el('iph' + i); if (ph) ph.style.display = ''; }
                }
                if (!item.title && el('tsh' + i)) {
                  el('tsh' + i).remove();
                  var ttl = el('ttl' + i);
                  if (ttl) { ttl.textContent = (meta && meta.title) ? meta.title : 'Amazon Product'; ttl.style.display = ''; }
                }
                if (meta && meta.price) {
                  var pr = el('pr' + i);
                  if (pr) {
                    var pct2 = savingPct(item.price, meta.price);
                    pr.innerHTML = '<span class="item-price">\u00a3' + item.price + '</span>' +
                      '<span class="item-rrp">\u00a3' + meta.price + '</span>' +
                      (pct2 > 0 ? '<span class="item-saving">' + pct2 + '% off</span>' : '');
                  }
                }
              } catch(e) {}
            });
          }
          return; // no delivery/WhatsApp needed
        }

        // Auto-fetch image + title if missing
        if (!item.img || !item.title) {
          fetchMeta(item.url, function(meta) {
            try {
              // Price — always use microlink's if it got one
              if (meta && meta.price) {
                var priceRow = el('pr' + i);
                if (priceRow) {
                  var pct2 = savingPct(item.price, meta.price);
                  priceRow.innerHTML =
                    '<span class="item-price">\u00a3' + item.price + '</span>' +
                    '<span class="item-rrp">\u00a3' + meta.price + '</span>' +
                    (pct2 > 0 ? '<span class="item-saving">' + pct2 + '% off</span>' : '');
                }
              }
              // Image
              if (!item.img && el('ish' + i)) {
                el('ish' + i).remove();
                if (meta && meta.img) {
                  var img = document.createElement('img');
                  img.src = meta.img;
                  img.onerror = function() {
                    img.remove();
                    var ph = el('iph' + i);
                    if (ph) ph.style.display = '';
                  };
                  var wrap = el('iw' + i);
                  if (wrap) wrap.insertBefore(img, wrap.firstChild);
                } else {
                  var ph = el('iph' + i);
                  if (ph) ph.style.display = '';
                }
              }
              // Title
              if (!item.title && el('tsh' + i)) {
                el('tsh' + i).remove();
                var ttl = el('ttl' + i);
                if (ttl) {
                  ttl.textContent = (meta && meta.title) ? meta.title : 'Amazon Product';
                  ttl.style.display = '';
                  item._title = ttl.textContent;
                }
              }
            } catch(e) {}
          });
        }

        // Delivery toggle
        var toggleBtns = document.querySelectorAll('.dtoggle-btn[data-i="' + i + '"]');
        var dfields = el('df' + i);
        var dpc = el('dpc' + i);
        var dh  = el('dh' + i);

        toggleBtns.forEach(function(btn) {
          btn.addEventListener('click', function() {
            try {
              toggleBtns.forEach(function(b) { b.classList.remove('is-active'); });
              btn.classList.add('is-active');
              mode = btn.getAttribute('data-m');
              if (mode === 'delivery') {
                dfields.classList.add('open');
                dpc.focus();
              } else {
                dfields.classList.remove('open');
                dcost = null; dmiles = null;
              }
            } catch(e) {}
          });
        });

        // Postcode input with debounce
        var timer = null;
        dpc.addEventListener('input', function() {
          try {
            clearTimeout(timer);
            dcost = null;
            if (dpc.value.length < 3) return;
            timer = setTimeout(function() {
              calcDelivery(dpc.value, dh, function(cost, miles) {
                dcost = cost; dmiles = miles;
              });
            }, 800);
          } catch(e) {}
        });

        // WhatsApp button
        el('wa' + i).addEventListener('click', function() {
          try {
            if (mode === 'delivery' && dpc.value.length < 3) {
              dh.textContent = 'Please enter your postcode first.';
              dh.className = 'delivery-hint err';
              dpc.focus(); return;
            }
            var title = item.title || item._title || 'your item';
            var msg = "Hey Ben! I'm interested in buying:\n\n" +
              title + "\n" +
              "Asking price: \u00a3" + item.price + "\n";
            if (mode === 'delivery') {
              msg += "I'd like delivery to: " + dpc.value + "\n";
              if (dcost) msg += "Delivery quote: \u00a3" + dcost + " (" + dmiles + " miles @ \u00a30.50/mile)\n";
            } else {
              msg += "I'll collect from Doddington.\n";
            }
            msg += "\nAmazon link: " + item.url + "\n\nIs it still available?";
            window.open('https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg), '_blank');
          } catch(e) {}
        });

      } catch(e) {} // one card's wiring failing won't affect others
    });

  } catch(e) {
    // Render itself failed — show a friendly message
    var list = document.getElementById('shopList');
    if (list) list.innerHTML =
      '<div class="empty-state">' +
        '<div class="emoji">\ud83d\udee0\ufe0f</div>' +
        '<h3>Something went wrong</h3>' +
        '<p>Couldn\'t load the shop right now.<br>Try refreshing the page.</p>' +
      '</div>';
  }
}

// ── Boot ───────────────────────────────────────────────────────────
render();

} catch(e) {
  // Absolute last resort — the whole script block failed
  document.getElementById('shopList').innerHTML =
    '<div class="empty-state">' +
      '<div class="emoji">\ud83d\udee0\ufe0f</div>' +
      '<h3>Something went wrong</h3>' +
      '<p>Couldn\'t load the shop.<br>Try refreshing the page.</p>' +
    '</div>';
}
</script>

</body>
</html>
