<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BHD Reset</title>
<meta name="theme-color" content="#0b0c10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
  :root {
    --bg:        #0b0c10;
    --surface:   #15171c;
    --surface2:  #1d2027;
    --surface3:  #262a33;
    --border:    rgba(255,255,255,0.08);
    --border-2:  rgba(255,255,255,0.14);
    --ink:       #f7f7f8;
    --ink2:      #b6b9c2;
    --ink3:      #7c8090;
    --brand:     #ffb26b;
    --brand2:    #ff7a59;
    --brand-grad: linear-gradient(135deg, #ffb26b 0%, #ff7a59 55%, #f15a4a 100%);
    --green-grad: linear-gradient(135deg, #3ee07f 0%, #1fb863 100%);
    --ease:      cubic-bezier(.2,.8,.2,1);
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(900px 500px at 10% -10%, rgba(255,122,89,0.10) 0%, transparent 60%),
      linear-gradient(180deg, #0b0c10 0%, #11131a 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top, 0) 0 0;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 18px calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 0.04em;
    line-height: 1;
    margin-bottom: 6px;
    background: var(--brand-grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .sub {
    font-size: 0.78rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink3);
    margin-bottom: 18px;
  }
  .card {
    background: linear-gradient(180deg, var(--surface2), var(--surface));
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #status {
    font-weight: 900;
    font-size: 1rem;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
    color: var(--brand);
  }
  #status.done { color: #6ee49a; }
  .log {
    font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    color: var(--ink2);
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    max-height: 50vh;
    overflow: auto;
  }
  .log:empty { display: none; }
  .btn {
    display: none;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 999px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.02rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    background: var(--green-grad);
    color: #062b15;
    box-shadow: 0 12px 28px rgba(31,184,99,0.35);
    transition: transform 140ms var(--ease), box-shadow 240ms var(--ease);
    position: relative; overflow: hidden;
  }
  .btn::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.32), transparent);
    transform: translateX(-120%);
    transition: transform 0.7s var(--ease);
  }
  .btn:hover::before { transform: translateX(120%); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(31,184,99,0.45); }
  .btn:active { transform: translateY(0) scale(0.97); }
  .btn.is-shown { display: block; animation: fadeUp 0.4s var(--ease) both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Humpin' &amp; Dumpin'</div>
  <div class="sub">App Reset Utility</div>
  <div class="card">
    <div id="status">Running reset…</div>
    <div class="log" id="log"></div>
  </div>
  <button id="go" class="btn">Go to App &rarr;</button>
</div>

<script>
(async function(){
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const say = (m)=>{ logEl.textContent += m + "\n"; console.log('[reset]', m); };

  try {
    if (!('serviceWorker' in navigator)) {
      say('No service worker support — nothing to reset.');
    } else {
      const regs = await navigator.serviceWorker.getRegistrations();
      if (regs.length === 0) {
        say('No registered service workers.');
      } else {
        for (const r of regs) {
          say('Unregistering SW at scope: ' + (r.scope || '(unknown)'));
          await r.unregister();
        }
      }
    }
  } catch(e){ say('SW error: ' + e); }

  try {
    if (window.caches && caches.keys) {
      const keys = await caches.keys();
      if (keys.length === 0) {
        say('No CacheStorage entries.');
      } else {
        for (const k of keys) {
          say('Deleting cache: ' + k);
          await caches.delete(k);
        }
      }
    } else {
      say('CacheStorage not available.');
    }
  } catch(e){ say('Cache error: ' + e); }

  try {
    localStorage.clear(); sessionStorage.clear();
    say('Cleared localStorage & sessionStorage.');
  } catch(e){ say('Storage clear error: ' + e); }

  statusEl.textContent = 'Reset complete ✔';
  statusEl.classList.add('done');
  const go = document.getElementById('go');
  go.classList.add('is-shown');
  go.addEventListener('click', function(){
    const t = Date.now();
    location.href = './index.html?reset=' + t;
  });
})();
</script>
</body>
</html>
